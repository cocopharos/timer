<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Timer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-container">
        <!-- 自然を感じさせる装飾的な円 -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="timer-card">
        <h1 class="title">Relax Timer</h1>
        
        <div class="time-display" id="time-display">
            25:00
        </div>
        
        <!-- SVG プログレスリング -->
        <svg class="progress-ring" width="240" height="240">
            <circle class="progress-ring__circle progress-ring__circle--bg" stroke-width="8" fill="transparent" r="110" cx="120" cy="120"/>
            <circle class="progress-ring__circle progress-ring__circle--fg" id="progress-circle" stroke-width="8" fill="transparent" r="110" cx="120" cy="120"/>
        </svg>

        <div class="input-group" id="input-group">
            <input type="number" id="minutes-input" value="25" min="0" max="99" class="time-input">
            <span class="colon">:</span>
            <input type="number" id="seconds-input" value="00" min="0" max="59" class="time-input">
        </div>

        <div class="controls">
            <button id="start-btn" class="btn btn-primary">Start</button>
            <button id="stop-btn" class="btn btn-secondary hidden">Pause</button>
            <button id="reset-btn" class="btn btn-tertiary">Reset</button>
        </div>
        
        <div class="sound-test">
            <button id="test-sound-btn" class="btn-text">🔔 音をテスト</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
